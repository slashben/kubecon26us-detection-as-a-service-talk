# TeamPCP Trivy supply-chain compromise: detection rules built from the advisory's
# indicators of compromise.
#
# Every rule matches literal event fields with profileDependency: 2, so it fires on
# the first run without a learned baseline (the CI runner pods are ephemeral and
# never complete a profile). Tagged "dac" so binding-dac-runners.yaml evaluates them
# on the runner pods.
#
# Not covered here, because the eBPF sensor never sees them: the tpcp-docs fallback
# repositories, the poisoned trivy commit 1885610c and the compromised GPG key
# E9D0A3616276FA6C. Those belong to SCM / signature checks, not runtime detection.
apiVersion: kubescape.io/v1
kind: Rules
metadata:
  name: dac-rules
  namespace: kubescape
spec:
  rules:
    - name: "TeamPCP C2 beacon (DNS)"
      enabled: true
      id: "DAC-0001"
      description: "A DNS lookup of a TeamPCP C2 or payload domain."
      expressions:
        message: "'C2 beacon: DNS lookup of ' + event.name + ' from ' + event.containerName"
        uniqueId: "event.name"
        ruleExpression:
          # Lookups that resolve.
          - eventType: "dns"
            expression: >
              event.name in ['scan.aquasecurtiy.org', 'scan.aquasecurtiy.org.',
              'hackmoltrepeat.com', 'hackmoltrepeat.com.',
              'tdtqy-oyaaa-aaaae-af2dq-cai.raw.icp0.io', 'tdtqy-oyaaa-aaaae-af2dq-cai.raw.icp0.io.',
              'plug-tab-protective-relay.trycloudflare.com', 'plug-tab-protective-relay.trycloudflare.com.']
          # Lookups that never resolve (NXDOMAIN typosquat, dead C2). Only seen as
          # dnsQuery events on node-agent >= v0.3.278 with dnsRuleForwarding on.
          # Gated on the query so the query and its error response don't both alert.
          - eventType: "dnsQuery"
            expression: >
              event.qr == 'Q' && event.name in ['scan.aquasecurtiy.org', 'scan.aquasecurtiy.org.',
              'hackmoltrepeat.com', 'hackmoltrepeat.com.',
              'tdtqy-oyaaa-aaaae-af2dq-cai.raw.icp0.io', 'tdtqy-oyaaa-aaaae-af2dq-cai.raw.icp0.io.',
              'plug-tab-protective-relay.trycloudflare.com', 'plug-tab-protective-relay.trycloudflare.com.']
      profileDependency: 2
      severity: 10
      supportPolicy: false
      isTriggerAlert: true
      mitreTactic: "TA0011"
      mitreTechnique: "T1071.004"
      tags:
        - "dac"
        - "c2"
        - "dns"
    - name: "TeamPCP persistence backdoor accessed"
      enabled: true
      id: "DAC-0002"
      description: "Any open of the systemd user backdoor path ~/.config/systemd/user/sysmon.py (write or execution)."
      expressions:
        message: "'Persistence backdoor file accessed: ' + event.path + ' by ' + event.comm"
        uniqueId: "event.path"
        ruleExpression:
          # Any open, not only writes: a shell-redirect write can be lost in the
          # open storm of the Trivy scan, while the read when it runs is reliably seen.
          - eventType: "open"
            expression: "event.path.endsWith('/.config/systemd/user/sysmon.py')"
      profileDependency: 2
      severity: 8
      supportPolicy: false
      isTriggerAlert: true
      mitreTactic: "TA0003"
      mitreTechnique: "T1543.002"
      tags:
        - "dac"
        - "persistence"
    - name: "TeamPCP exfiltration archive created"
      enabled: true
      id: "DAC-0003"
      description: "Creation or handling of the tpcp.tar.gz exfiltration archive."
      expressions:
        message: "'Exfiltration archive tpcp.tar.gz handled by ' + event.comm"
        uniqueId: "event.comm"
        ruleExpression:
          # Opened via open/openat (e.g. a shell redirect).
          - eventType: "open"
            expression: "event.path.endsWith('/tpcp.tar.gz')"
          # tar writes via openat2, which the open tracer misses; its argv names the file.
          - eventType: "exec"
            expression: "event.args.exists(a, string(a).endsWith('tpcp.tar.gz'))"
      profileDependency: 2
      severity: 8
      supportPolicy: false
      isTriggerAlert: true
      mitreTactic: "TA0009"
      mitreTechnique: "T1560.001"
      tags:
        - "dac"
        - "exfiltration"
    - name: "TeamPCP backdoor process executed"
      enabled: true
      id: "DAC-0004"
      description: "Execution of the sysmon.py backdoor, or any process carrying the C2 IP 45.148.10.212 as an argument."
      expressions:
        message: "'Backdoor process executed: ' + event.comm + ' (pid ' + string(event.pid) + ')'"
        uniqueId: "event.comm + '_' + string(event.pid)"
        ruleExpression:
          # Match the running backdoor by comm, not the sysmon.py path in argv, so
          # helpers like chmod or cat that merely touch the file don't alert.
          - eventType: "exec"
            expression: "event.comm == 'sysmon.py' || event.args.exists(a, string(a) == '45.148.10.212')"
      profileDependency: 2
      severity: 10
      supportPolicy: false
      isTriggerAlert: true
      mitreTactic: "TA0002"
      mitreTechnique: "T1059.006"
      tags:
        - "dac"
        - "backdoor"
        - "exec"
