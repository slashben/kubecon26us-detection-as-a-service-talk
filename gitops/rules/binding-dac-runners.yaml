# Binds the demo rules to the CI runner pods. Without a RuntimeRuleAlertBinding
# node-agent evaluates no rules at all (the chart's default binding is off).
#
# Rules are selected by tag, not by name:
#   dac                 every entry in dac-rules.yaml (tag new demo rules with it)
#   context:kubernetes  every rule in upstream-rules.yaml (all upstream rules carry it)
apiVersion: kubescape.io/v1
kind: RuntimeRuleAlertBinding
metadata:
  name: dac-runners-all-rules
spec:
  namespaceSelector:
    matchLabels:
      kubernetes.io/metadata.name: arc-runners
  podSelector:
    matchLabels:
      dac.kubescape.io/role: ci-runner
  rules:
    - ruleTags: ["dac", "context:kubernetes"]
