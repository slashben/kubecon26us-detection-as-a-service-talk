clusterName: dac-demo

capabilities:
  runtimeObservability: enable
  runtimeDetection: enable

nodeAgent:
  # Override the chart's node-agent (v0.3.219) with the first release that ships
  # DNS query rule forwarding (the dnsQuery eventType), so a C2/typosquat lookup
  # that never resolves (NXDOMAIN) still fires DAC-0001. Chart 1.40.5 and 1.41.0
  # both still pin v0.3.219. Revisit when the chart adopts a newer node-agent.
  #
  # WARNING: if this ever drops below v0.3.278 (a chart bump that resets the tag,
  # a cluster recreate, or a mutable-tag change), the dnsQuery path goes dormant
  # SILENTLY: the rule still loads and DAC-0001 still fires on resolving C2
  # domains, so the demo looks fine while the headline NXDOMAIN typosquat stops
  # firing. The pre-demo sanity check in docs/demo-setup.md guards against this.
  image:
    tag: v0.3.278
  config:
    # host:port, no scheme (node-agent pkg/exporters/alert_manager.go).
    # alertmanager-operated is the headless service the Prometheus operator always creates.
    alertManagerExporterUrls:
      - alertmanager-operated.monitoring.svc.cluster.local:9093
    stdoutExporter: true
    # Chart default is 1h after the first alert, which hides a second demo run.
    ruleCooldown:
      ruleCooldownDuration: 30s
      ruleCooldownAfterCount: 1
    # Forward DNS queries and error responses (NXDOMAIN/SERVFAIL) to rule
    # evaluation, so a lookup of a C2 domain that never resolves still fires a
    # rule (eventType "dnsQuery"). Not exposed as a first-class chart key yet, so
    # set via the config.extra passthrough. Requires runtimeDetection (enabled above).
    extra:
      dnsRuleForwarding:
        enabled: true
